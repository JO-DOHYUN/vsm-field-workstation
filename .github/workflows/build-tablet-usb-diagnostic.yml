name: Build Tablet USB Diagnostic APK

on:
  push:
    branches:
      - 'codex/tablet-usb-diagnostic-apk'
    paths:
      - 'tools/tablet-usb-diagnostic/**'
      - '.github/workflows/build-tablet-usb-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: tools/tablet-usb-diagnostic
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          cp tools/tablet-usb-diagnostic/app/build/outputs/apk/debug/app-debug.apk Tablet_USB_Diagnostic.apk
          sha256sum Tablet_USB_Diagnostic.apk > Tablet_USB_Diagnostic.sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tablet-usb-diagnostic-apk
          path: |
            Tablet_USB_Diagnostic.apk
            Tablet_USB_Diagnostic.sha256.txt
          if-no-files-found: error
          retention-days: 7
